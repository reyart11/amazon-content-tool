<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>Amazon ASIN Filter V4</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f4f6;color:#111827;margin:0}main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
h1{font-size:24px;margin:4px 0}.muted,.small{color:#6b7280;font-size:14px}
textarea,input{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:12px;padding:12px;font-size:15px;margin-top:8px}
textarea{min-height:220px}button{border:0;border-radius:12px;padding:11px 14px;margin:8px 6px 0 0;font-weight:700;background:#111827;color:#fff}
button.secondary{background:#e5e7eb;color:#111827}.row{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-block;background:#f3f4f6;padding:8px 12px;border-radius:10px;margin:5px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e5e7eb;padding:9px 6px}
.ok{color:#047857;font-weight:700}.warn{color:#b45309;font-weight:700}
</style></head><body><main>
<div class="card"><h1>🔎 Amazon ASIN Filter V4</h1>
<div class="muted">Copy seluruh teks/HTML dari satu halaman, paste sekali, lalu saring ASIN unik.</div></div>
<div class="card"><h3>1. Tempel isi halaman</h3>
<textarea id="source" placeholder="Paste teks atau HTML di sini..."></textarea>
<div class="row"><button onclick="extractASINs()">🔎 Ekstrak ASIN</button><button class="secondary" onclick="clearAll()">🗑️ Bersihkan</button></div>
<p class="small">Membaca URL /dp/ASIN, /gp/product/ASIN, data-asin, label ASIN, dan ASIN modern yang diawali B0.</p></div>
<div class="card"><h3>2. Hasil</h3><div id="stats"></div>
<textarea id="result" placeholder="ASIN unik akan muncul di sini..." readonly></textarea>
<div class="row"><button onclick="copyASINs()">📋 Copy ASIN</button><button onclick="copyLinks()">🔗 Copy Affiliate Links</button><button onclick="downloadCSV()">⬇️ Download CSV</button></div></div>
<div class="card"><h3>3. Affiliate Amazon.de</h3><label>Tracking ID</label>
<input id="tag" placeholder="contoh: namamu-21"><button onclick="saveTag()">💾 Simpan</button>
<div id="linkPreview" class="small" style="margin-top:10px"></div></div>
<div class="card"><h3>Daftar terdeteksi</h3><div id="tableWrap" class="muted">Belum ada hasil.</div></div>
</main>
<script>
const tagEl=document.getElementById('tag');tagEl.value=localStorage.getItem('amazonTagV4')||'';
function norm(s){return s.toUpperCase().trim()}
function extractASINs(){
 const text=document.getElementById('source').value||'',found=[]; const add=x=>{x=norm(x);if(/^[A-Z0-9]{10}$/.test(x)&&!found.includes(x))found.push(x)};
 const rs=[
 /(?:amazon\.[a-z.]+)\/.*?\/dp\/([A-Z0-9]{10})(?=[\/?#\s"'<>]|$)/gi,
 /(?:amazon\.[a-z.]+)\/.*?\/gp\/product\/([A-Z0-9]{10})(?=[\/?#\s"'<>]|$)/gi,
 /(?:amazon\.[a-z.]+)\/.*?\/gp\/aw\/d\/([A-Z0-9]{10})(?=[\/?#\s"'<>]|$)/gi,
 /(?:amazon\.[a-z.]+)\/.*?[?&](?:asin|ASIN)=([A-Z0-9]{10})(?:[&#\s"'<>]|$)/gi,
 /(?:data-asin|data-asin-id|asin)\s*=\s*["']([A-Z0-9]{10})["']/gi,
 /\bASIN\s*[:#=\-]?\s*([A-Z0-9]{10})\b/gi
 ];
 for(const re of rs){let m;while((m=re.exec(text))!==null)add(m[1])}
 let m;const modern=/\b(B0[A-Z0-9]{8})\b/gi;while((m=modern.exec(text))!==null)add(m[1]);
 render(found);
}
function render(list){
 document.getElementById('result').value=list.join('\n');
 document.getElementById('stats').innerHTML='<span class="stat"><b>'+list.length+'</b> ASIN unik</span>'+(list.length?'<span class="stat ok">Siap dipakai</span>':'');
 if(!list.length){document.getElementById('tableWrap').innerHTML='<span class="warn">Tidak menemukan ASIN.</span>';return}
 let h='<table><thead><tr><th>#</th><th>ASIN</th><th>Amazon.de</th></tr></thead><tbody>';
 list.forEach((a,i)=>h+='<tr><td>'+(i+1)+'</td><td><b>'+a+'</b></td><td><a target="_blank" href="https://www.amazon.de/dp/'+a+'">Buka</a></td></tr>');
 document.getElementById('tableWrap').innerHTML=h+'</tbody></table>';
 const tag=tagEl.value.trim();document.getElementById('linkPreview').textContent=tag?'Contoh: https://www.amazon.de/dp/'+list[0]+'/?tag='+encodeURIComponent(tag):'Masukkan Tracking ID untuk affiliate link.';
}
function list(){return document.getElementById('result').value.split(/\s+/).filter(Boolean)}
async function copyASINs(){await navigator.clipboard.writeText(list().join('\n'));alert('ASIN sudah disalin.')}
async function copyLinks(){const t=tagEl.value.trim();if(!t){alert('Masukkan Tracking ID dulu.');return}await navigator.clipboard.writeText(list().map(a=>'https://www.amazon.de/dp/'+a+'/?tag='+t).join('\n'));alert('Affiliate links sudah disalin.')}
function downloadCSV(){const t=tagEl.value.trim(),rows=[['No','ASIN','Amazon.de URL','Affiliate URL']];list().forEach((a,i)=>rows.push([i+1,a,'https://www.amazon.de/dp/'+a,t?'https://www.amazon.de/dp/'+a+'/?tag='+t:'']));const csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');const b=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='amazon-asin-v4.csv';a.click()}
function saveTag(){localStorage.setItem('amazonTagV4',tagEl.value.trim());render(list());alert('Tracking ID disimpan.')}
function clearAll(){document.getElementById('source').value='';render([])} render([]);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
